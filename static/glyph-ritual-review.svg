      <text x="16" y="34" fill="#fff" font-size="17" font-weight="900">CROWN CHASER</text><rect x="136" y="18" width="85" height="25" rx="2" fill="#242a38" stroke="#596072"/><text x="150" y="35" fill="#fff" font-size="12">Uncategorized</text><rect x="250" y="18" width="34" height="25" rx="2" fill="#2b210d" stroke="#a87211"/><text x="260" y="35" fill="#ffd15a" font-size="12">1d</text><rect x="302" y="18" width="48" height="25" rx="13" fill="#141823" stroke="#3b4158"/><text x="314" y="35" fill="#fff" font-size="12">Detail</text>
      <rect x="16" y="52" width="126" height="25" rx="2" fill="#181329" stroke="#59478d"/><text x="27" y="69" fill="#b99bff" font-size="12">Live Brokerage Account</text>
      <text x="16" y="120" fill="#7f899b" font-size="12">RITUAL VALUE</text><text x="16" y="143" fill="#fff" font-size="17">$207.87</text><text x="142" y="120" fill="#7f899b" font-size="12">RITUAL P&amp;L</text><text x="142" y="143" fill="#00d38f" font-size="17">+$0.05 (0.02%)</text><text x="255" y="120" fill="#7f899b" font-size="12">BOOK STATUS</text><text x="255" y="143" fill="#fff" font-size="17">Reconciled book</text>
