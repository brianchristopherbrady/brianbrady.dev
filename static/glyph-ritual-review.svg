<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 520" role="img" aria-labelledby="title desc">
  <title id="title">Glyph ritual review cards</title>
  <desc id="desc">Dark Glyph interface showing reconciled ritual cards with strategy labels, account status, PnL, book status, explanation panels, and small backtest charts.</desc>
  <defs>
