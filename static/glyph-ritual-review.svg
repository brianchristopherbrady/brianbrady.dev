    <linearGradient id="why" x1="0" x2="1"><stop stop-color="#0a1119"/><stop offset="1" stop-color="#08161d"/></linearGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1600" height="520" fill="url(#bg)"/>
  <g font-family="Inter,Arial" font-weight="800">
