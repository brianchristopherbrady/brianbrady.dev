    </g>
    <g transform="translate(800 28)">
      <rect width="360" height="460" rx="14" fill="url(#card)" stroke="#30364f"/><text x="16" y="34" fill="#fff" font-size="17" font-weight="900">FRONT RUNNER HYDRA v2</text><rect x="16" y="52" width="34" height="25" rx="2" fill="#2b210d" stroke="#a87211"/><text x="26" y="69" fill="#ffd15a" font-size="12">1d</text><rect x="70" y="52" width="126" height="25" rx="2" fill="#181329" stroke="#59478d"/><text x="81" y="69" fill="#b99bff" font-size="12">Live Brokerage Account</text><text x="16" y="120" fill="#7f899b" font-size="12">RITUAL VALUE</text><text x="16" y="143" fill="#fff" font-size="17">$6.74</text><text x="142" y="120" fill="#7f899b" font-size="12">RITUAL P&amp;L</text><text x="142" y="143" fill="#ff4778" font-size="17">$-0.09 (-1.32%)</text><text x="255" y="120" fill="#7f899b" font-size="12">BOOK STATUS</text><text x="255" y="143" fill="#fff" font-size="17">Reconciled book</text><rect x="16" y="166" width="328" height="128" rx="9" fill="url(#why)" stroke="#063a3f"/><text x="28" y="190" fill="#7f899b" font-size="12" letter-spacing="1">WHY THIS RITUAL IS HERE</text><text x="28" y="216" fill="#cbd5e1" font-size="15">Glyph-native v2 refactor of a Composer</text><text x="28" y="238" fill="#cbd5e1" font-size="15">overbought/VIX/KMLM rotator. Scores froth,</text><text x="28" y="260" fill="#cbd5e1" font-size="15">volatility ignition, rebound, and regimes.</text><rect x="16" y="315" width="328" height="88" rx="5" fill="#08111a" stroke="#262d45"/><path d="M98 335 L290 393" stroke="#ff4778" stroke-width="3"/><path d="M16 397 H344" stroke="#ff4778" stroke-dasharray="2 3"/><text x="26" y="395" fill="#fff" font-size="31" font-weight="900">T7</text><rect x="16" y="430" width="72" height="32" rx="16" fill="#121621" stroke="#30364f"/><text x="31" y="451" fill="#fff" font-size="13">Backtest</text>
    </g>
    <g transform="translate(1184 28)">
      <rect width="360" height="460" rx="14" fill="url(#card)" stroke="#30364f"/><text x="16" y="34" fill="#fff" font-size="17" font-weight="900">FTLT v5 Frontrunner/KMLM Battleship</text><rect x="16" y="52" width="116" height="25" rx="2" fill="#311315" stroke="#b63d48"/><text x="28" y="69" fill="#fff" font-size="12">Tactical Growth</text><rect x="152" y="52" width="34" height="25" rx="2" fill="#2b210d" stroke="#a87211"/><text x="162" y="69" fill="#ffd15a" font-size="12">1d</text><rect x="204" y="52" width="126" height="25" rx="2" fill="#181329" stroke="#59478d"/><text x="215" y="69" fill="#b99bff" font-size="12">Live Brokerage Account</text><text x="16" y="120" fill="#7f899b" font-size="12">RITUAL VALUE</text><text x="16" y="143" fill="#fff" font-size="17">$6.69</text><text x="142" y="120" fill="#7f899b" font-size="12">RITUAL P&amp;L</text><text x="142" y="143" fill="#00d38f" font-size="17">+$0.16 (2.45%)</text><text x="255" y="120" fill="#7f899b" font-size="12">BOOK STATUS</text><text x="255" y="143" fill="#fff" font-size="17">Reconciled book</text><rect x="16" y="166" width="328" height="128" rx="9" fill="url(#why)" stroke="#063a3f"/><text x="28" y="190" fill="#7f899b" font-size="12" letter-spacing="1">WHY THIS RITUAL IS HERE</text><text x="28" y="216" fill="#cbd5e1" font-size="15">Native Symphony-style refactor. Checks SPY,</text><text x="28" y="238" fill="#cbd5e1" font-size="15">IOO, TQQQ, VTV, XLF, and VOX from Omens</text><text x="28" y="260" fill="#cbd5e1" font-size="15">for Battleship branches and bear regimes.</text><rect x="16" y="315" width="328" height="88" rx="5" fill="#08111a" stroke="#262d45"/><path d="M98 335 L290 393" stroke="#00d38f" stroke-width="3"/><path d="M16 397 H344" stroke="#00d38f" stroke-dasharray="2 3"/><text x="26" y="395" fill="#fff" font-size="31" font-weight="900">T7</text><rect x="16" y="430" width="72" height="32" rx="16" fill="#121621" stroke="#30364f"/><text x="31" y="451" fill="#fff" font-size="13">Backtest</text>
